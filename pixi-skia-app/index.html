<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixi → Skia Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #12121a;
      --border:    #1e1e2e;
      --accent:    #7c3aed;
      --accent2:   #f59e0b;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --success:   #10b981;
      --danger:    #ef4444;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: 56px 1fr 44px;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    header .logo span { color: var(--accent); }
    header .sep { flex: 1; }
    header .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 2px;
      background: var(--accent);
      color: white;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── Main area ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel + .panel { border-left: 1px solid var(--border); }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }
    .panel-header .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .panel-header .dot.amber { background: var(--accent2); }

    .canvas-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.04) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
        var(--bg);
    }

    /* Pixi canvas sits inside */
    #pixi-canvas-wrap canvas,
    #skia-canvas-wrap canvas {
      display: block;
    }

    /* ── Sidebar controls ── */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: white; background: rgba(124,58,237,0.12); }
    .btn.active { border-color: var(--accent); background: rgba(124,58,237,0.25); color: white; }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .btn.primary:hover { background: #6d28d9; }
    .btn.amber { border-color: var(--accent2); background: var(--accent2); color: #1a1a1a; }
    .btn.amber:hover { background: #d97706; }
    .btn:disabled { opacity: .4; pointer-events: none; }

    /* ── Scene switcher pills ── */
    #scene-tabs {
      display: flex;
      gap: 6px;
    }

    /* ── Status bar ── */
    footer {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 10px;
      color: var(--muted);
    }
    footer .status-item { display: flex; align-items: center; gap: 5px; }
    footer .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
    footer .status-dot.loading { background: var(--accent2); animation: pulse 1s ease-in-out infinite; }
    footer .spacer { flex: 1; }

    /* ── Event log ── */
    #event-log {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 220px;
      max-height: 120px;
      overflow-y: auto;
      background: rgba(10,10,15,0.9);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 10px;
      color: var(--muted);
      pointer-events: none;
    }
    #event-log .log-entry { padding: 1px 0; }
    #event-log .log-entry.down { color: #a78bfa; }
    #event-log .log-entry.up   { color: var(--accent2); }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity .4s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .loader-title span { color: var(--accent); }
    .loader-bar-wrap {
      width: 240px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .3s ease;
    }
    .loader-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-overlay">
  <div class="loader-title">Pixi<span>→</span>Skia</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loader-bar"></div></div>
  <div class="loader-sub" id="loader-sub">Initialising...</div>
</div>

<div id="app">
  <header>
    <div class="logo">Pixi<span>→</span>Skia</div>
    <div id="scene-tabs"></div>
    <div class="sep"></div>
    <button class="btn amber" id="btn-export">⬇ Export PDF</button>
    <div class="badge">v1.0</div>
  </header>

  <main>
    <!-- Left: Pixi -->
    <div class="panel">
      <div class="panel-header">
        <div class="dot"></div>
        PixiJS Canvas (source)
      </div>
      <div class="canvas-wrap" id="pixi-canvas-wrap">
        <div id="event-log"></div>
      </div>
      <div class="controls-bar" style="height:44px;">
        <button class="btn" id="btn-prev">← Prev</button>
        <button class="btn" id="btn-next">Next →</button>
        <div style="flex:1"></div>
        <span style="color:var(--muted);font-size:10px;" id="scene-label">Scene 1 / 3</span>
      </div>
    </div>

    <!-- Right: Skia -->
    <div class="panel">
      <div class="panel-header">
        <div class="dot amber"></div>
        Skia Re-render (mirror)
      </div>
      <div class="canvas-wrap" id="skia-canvas-wrap"></div>
      <div class="controls-bar" style="height:44px;">
        <span style="color:var(--muted);font-size:10px;">Live Skia mirror — same scene, different renderer</span>
      </div>
    </div>
  </main>

  <footer>
    <div class="status-item">
      <div class="status-dot" id="pixi-status-dot"></div>
      <span>PixiJS ready</span>
    </div>
    <div class="status-item">
      <div class="status-dot loading" id="skia-status-dot"></div>
      <span id="skia-status-text">Loading CanvasKit WASM…</span>
    </div>
    <div class="spacer"></div>
    <span id="fps-counter">— fps</span>
  </footer>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
